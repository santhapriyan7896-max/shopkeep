<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Activewear33</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <!-- Customer: Instagram DM -->
    <figure class="device">
      <div class="phone">
        <div class="island"></div>
        <div class="screen ig">
          <div class="statusbar"><span class="time js-clock">1:12</span><span class="sys-icons">
            <svg viewBox="0 0 18 12" width="17"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg viewBox="0 0 16 12" width="15"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .8 10.2 10.2 0 0 0 .9 3.7L2 4.9a8.6 8.6 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.1-1.2A6.8 6.8 0 0 0 8 4.2c-1.8 0-3.5.7-4.7 1.9l1.1 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.3c-.6 0-1.1.2-1.5.6L8 11.4l1.5-1.6c-.4-.4-.9-.6-1.5-.6Z"/></svg>
            <span class="battery"><i></i></span></span></div>
          <header class="ig-head">
            <svg class="ico" viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="avatar lg"><b>AW</b><small>33</small></span>
            <div class="who"><b>Activewear33 | Sportswear</b><span>activewear.33</span></div>
            <svg class="ico" viewBox="0 0 24 24"><path d="M6.6 3.5h2.6l1.4 4.2-2 1.4a12 12 0 0 0 6.3 6.3l1.4-2 4.2 1.4v2.6a2 2 0 0 1-2.2 2A16.6 16.6 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <svg class="ico" viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 10.5 6-3.5v10l-6-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </header>
          <div class="ig-msgs" id="igMsgs"></div>
          <div class="ig-attach" id="attach"><span class="thumb" id="attachThumb"></span><span id="attachName"></span><button id="attachClear" aria-label="Remove">✕</button></div>
          <footer class="ig-compose">
            <button class="cam" id="shareBtn" title="Share a post"><svg viewBox="0 0 24 24" width="18"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.7l1.3-2h5l1.3 2h1.7A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-8Z" fill="none" stroke="#fff" stroke-width="1.9"/><circle cx="12" cy="12.3" r="3.4" fill="none" stroke="#fff" stroke-width="1.9"/></svg></button>
            <input id="input" placeholder="Message..." autocomplete="off" />
            <button class="send" id="sendBtn">Send</button>
            <span class="tools" id="tools">
              <svg viewBox="0 0 24 24" width="22"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <svg viewBox="0 0 24 24" width="22"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="9" r="1.7"/><path d="m4 17 5-5 4 4 2.5-2.5L20 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              <svg viewBox="0 0 24 24" width="22"><path d="M20.5 12a8.5 8.5 0 1 1-8.5-8.5h5a3.5 3.5 0 0 1 3.5 3.5v5Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 14.5s1.2 1.5 3.5 1.5 3.5-1.5 3.5-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
          </footer>
          <div class="paysheet" id="paysheet">
            <div class="pay-bar">
              <button id="payClose" aria-label="Close">✕</button>
              <div class="pay-url"><b>Secure checkout</b><span>🔒 Activewear33 · UPI</span></div>
            </div>
            <div class="pay-body" id="payBody"></div>
          </div>
          <div class="sheet" id="sheet">
            <div class="grabber"></div>
            <div class="sheet-title">activewear.33</div>
            <div class="grid" id="postGrid"></div>
          </div>
        </div>
      </div>
      <figcaption>Customer · Instagram</figcaption>
    </figure>

    <!-- Owner: WhatsApp alerts -->
    <figure class="device">
      <div class="phone">
        <div class="island"></div>
        <div class="screen wa">
          <div class="statusbar"><span class="time js-clock">1:12</span><span class="sys-icons">
            <svg viewBox="0 0 18 12" width="17"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <span class="battery"><i></i></span></span></div>
          <header class="wa-head">
            <svg class="ico" viewBox="0 0 24 24"><path d="M19 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="avatar"><b>AW</b><small>33</small></span>
            <div class="who"><b>Activewear33 Alerts</b><span>business account</span></div>
            <svg class="ico" viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 10.5 6-3.5v10l-6-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
          </header>
          <div class="wa-msgs" id="waMsgs"></div>
          <footer class="wa-compose">
            <span class="wa-input">Message</span>
            <span class="wa-mic"><svg viewBox="0 0 24 24" width="20"><rect x="9" y="3" width="6" height="11" rx="3" fill="#0b141a"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="#0b141a" stroke-width="2" stroke-linecap="round"/></svg></span>
          </footer>
        </div>
      </div>
      <figcaption>Shop owner · WhatsApp</figcaption>
    </figure>
  </main>

  <!-- Demo controls: hidden for recording. Press H to show/hide. -->
  <button class="ctl-toggle" id="ctlToggle" aria-label="Demo controls">•••</button>
  <aside class="ctl" id="ctl">
    <div class="ctl-row">
      <button id="playAll">Play full demo <kbd>P</kbd></button>
      <button id="morningBtn">Morning summary <kbd>M</kbd></button>
      <button id="resetBtn">Reset <kbd>R</kbd></button>
      <a class="dash-link" href="dashboard.html" target="_blank" rel="noopener">Owner dashboard ↗</a>
    </div>
    <div class="ctl-list" id="scenarioList"></div>
    <div class="ctl-row small">
      <label><input type="checkbox" id="fast" /> Fast typing</label>
      <label><input type="checkbox" id="liveToggle" disabled /> <span id="liveLabel">Live AI (needs API key)</span></label>
    </div>
    <p class="ctl-note">Press <kbd>H</kbd> to hide this panel before recording. Reset also clears the dashboard. Prices are samples.</p>
  </aside>
  <div class="toast" id="toast"></div>

  <script src="catalog.js"></script>
  <script src="validate.js"></script>
  <script src="store.js"></script>
  <script src="bot.js"></script>
  <script src="scenarios.js"></script>
  <script src="app.js"></script>
</body>
</html>
