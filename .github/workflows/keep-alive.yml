name: Keep alive

# Free Supabase projects pause after about a week without activity, which switches the
# owner app and the Instagram webhook off. Touch the database once a day.
on:
  schedule:
    - cron: "17 3 * * *" # every day, 08:47 IST
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the server and its database
        run: curl -fsS --retry 4 --retry-delay 30 --retry-all-errors --max-time 120 "https://shopkeep-j2d1.onrender.com/healthz?db=1"
